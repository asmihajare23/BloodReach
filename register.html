<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | BloodConnect</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">


<!-- ================= REGISTER CONTAINER ================= -->

<div class="auth-container">


    <!-- LEFT SIDE -->

    <div class="auth-decoration">

        <div class="auth-blood">
            +
        </div>

        <span class="section-label">
            BLOODCONNECT
        </span>

        <h1>
            Become Part<br>
            of the Community.
        </h1>

        <p>
            Create your account and help connect
            blood donors with people in need.
        </p>

    </div>


    <!-- RIGHT SIDE -->

    <div class="auth-box">

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>


        <div class="auth-heading">

            <span class="section-label">
                JOIN US
            </span>

            <h2>
                Create Account
            </h2>

            <p>
                Register with BloodConnect today.
            </p>

        </div>


        <!-- REGISTER FORM -->

        <form onsubmit="registerUser(event)">


            <!-- FULL NAME -->

            <div class="form-icon">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-icon">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- PHONE -->

            <div class="form-icon">

                <label for="registerPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="registerPhone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-icon">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >

            </div>


            <!-- BLOOD GROUP -->

            <div class="form-icon">

                <label for="registerBlood">
                    Blood Group
                </label>

                <select
                    id="registerBlood"
                    required
                >

                    <option value="">
                        Select Blood Group
                    </option>

                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>

                </select>

            </div>


            <!-- LOCATION -->

            <div class="form-icon">

                <label for="registerCity">
                    City
                </label>

                <input
                    type="text"
                    id="registerCity"
                    placeholder="Enter your city"
                    required
                >

            </div>


            <!-- TERMS -->

            <label class="remember">

                <input
                    type="checkbox"
                    required
                >

                I agree to the BloodConnect
                terms and conditions.

            </label>


            <!-- BUTTON -->

            <button
                type="submit"
                class="btn primary-btn auth-button"
            >

                Create Account

            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="auth-footer">

            <p>
                Already have an account?
            </p>

            <a href="login.html">
                Sign In
            </a>

        </div>

    </div>

</div>


<script src="js/script.js"></script>

</body>

</html>
